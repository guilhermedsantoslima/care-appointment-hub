version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: care-postgres
    environment:
      POSTGRES_DB: care_db
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: care-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"

  appointment-service:
    build: .
    container_name: care-appointment
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - rabbitmq